<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vehicle Rental - Admin Login</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; background: #eef2f3; margin: 0; }
        .login-card { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.1); width: 100%; max-width: 350px; text-align: center; }
        h2 { color: #2c3e50; margin-bottom: 20px; font-size: 24px; }
        label { display: block; text-align: left; font-weight: 600; color: #34495e; margin-top: 15px; }
        input { width: 100%; padding: 12px; margin-top: 6px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
        button { background: #3498db; color: white; border: none; font-size: 16px; font-weight: bold; width: 100%; padding: 12px; border-radius: 6px; cursor: pointer; margin-top: 25px; transition: 0.2s; }
        button:hover { background: #2980b9; }
        .hint { font-size: 11px; color: #95a5a6; margin-top: 15px; }
    </style>
</head>
<body>
    <div class="login-card">
        <h2>🔒 Portal Login</h2>
        <form id="login-form">
            <label>Username:</label>
            <input type="text" id="username" placeholder="Enter Admin Username" required>
            <label>Password:</label>
            <input type="password" id="password" placeholder="Enter Password" required>
            <button type="submit">Access System</button>
        </form>
        <div class="hint">Demo Credentials: admin / admin123</div>
    </div>

    <script>
        document.getElementById('login-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const payload = {
                username: document.getElementById('username').value,
                password: document.getElementById('password').value
            };
            fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            })
            .then(res => res.json())
            .then(data => {
                if(data.success) {
                    window.location.href = '/'; // Dashboard par redirect karein
                } else {
                    alert(data.message);
                }
            });
        });
    </script>
</body>
</html>
